name: Ruby

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# The editor tooling has C extensions that do not build everywhere, and no test needs it
env:
  BUNDLE_WITHOUT: editor

jobs:
  ruby-versions:
    uses: ruby/actions/.github/workflows/ruby_versions.yml@f0adcbc13299b38a289a1c914af4ad137ca6bb54
    with:
      engine: all
      min_version: 3.2

  test:
    needs: ruby-versions
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ${{ fromJson(needs.ruby-versions.outputs.versions) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      # The Ractor tests call Plume.eager_load!, which freezes every node class, so they get a process of their own
      - name: Quickdraw tests
        if: ${{ !startsWith(matrix.ruby-version, 'jruby') }}
        run: bundle exec qt -t 1 $(ls test/*.test.rb | grep -v -e ractor.test.rb)
      # sqlite3 is a C extension, so JRuby skips the tests that check Plume against SQLite itself
      - name: Quickdraw tests (without SQLite)
        if: ${{ startsWith(matrix.ruby-version, 'jruby') }}
        run: bundle exec qt -t 1 $(ls test/*.test.rb | grep -v -e ractor.test.rb -e fts.test.rb -e reads_oracle.test.rb -e catalog_from_sqlite.test.rb -e fuzz_identifiers.test.rb -e placeholders_oracle.test.rb -e normalize_oracle.test.rb -e calls_oracle.test.rb -e triggers_oracle.test.rb -e actions_oracle.test.rb -e summary_oracle.test.rb)
      # TruffleRuby and JRuby have no Ractors
      - name: Ractor tests
        if: ${{ !startsWith(matrix.ruby-version, 'jruby') && !startsWith(matrix.ruby-version, 'truffleruby') }}
        run: bundle exec qt -t 1 test/ractor.test.rb

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Ruby from .ruby-version, Bundler and RuboCop from Gemfile.lock
      - name: Set up Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: .ruby-version
          bundler: Gemfile.lock
          bundler-cache: true
      - name: RuboCop
        run: bundle exec rubocop
