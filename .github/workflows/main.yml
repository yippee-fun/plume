name: Ruby

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  ruby-versions:
    uses: ruby/actions/.github/workflows/ruby_versions.yml@f0adcbc13299b38a289a1c914af4ad137ca6bb54
    with:
      engine: all
      min_version: 3.2

  test:
    needs: ruby-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ${{ fromJson(needs.ruby-versions.outputs.versions) }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Quickdraw tests
        if: ${{ !startsWith(matrix.ruby-version, 'jruby') }}
        run: bundle exec qt -t 1 "./test/**/*.test.rb"
      # sqlite3 is a C extension, so JRuby skips the tests that check Plume against SQLite itself
      - name: Quickdraw tests (without SQLite)
        if: ${{ startsWith(matrix.ruby-version, 'jruby') }}
        run: bundle exec qt -t 1 $(ls test/*.test.rb | grep -v -e fts.test.rb -e reads_oracle.test.rb -e fuzz_identifiers.test.rb)

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: RuboCop
        run: bundle exec rubocop
